<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Slot Exam System v16.0</title>

<style>
body {
    font-family: -apple-system, "Helvetica Neue", "Segoe UI", sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 15px;
    padding-bottom: 90px; 
    -webkit-text-size-adjust: 100%;
}

.top {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

/* 카드 */
.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/* タブ */
.tab {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}

.tab button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #ddd;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.tab button.active {
    background: #2d6cdf;
    color: white;
}

/* 入力項目 */
textarea, input, select {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid #ccc;
    box-sizing: border-box;
    font-size: 16px; 
}

.form-label {
    font-size: 13px;
    font-weight: bold;
    color: #555;
    margin-top: 10px;
    display: block;
}

button {
    padding: 12px;
    margin-top: 8px;
    border: none;
    border-radius: 8px;
    background: #2d6cdf;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

/* 問題表示 */
.question {
    padding: 15px;
    border-left: 4px solid #2d6cdf;
    background: #fafafa;
    margin-top: 12px;
    font-size: 15px;
    line-height: 2.2; /* 인라인 입력창과 텍스트 겹침 방지 */
    position: relative;
}

.tag-badge {
    display: inline-block;
    background: #e1ecf8;
    color: #2d6cdf;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 12px;
    margin-right: 5px;
    margin-top: 5px;
    font-weight: bold;
}

/* 인라인 빈칸 입력창 */
.inline-blank-container {
    display: inline-flex;
    align-items: center;
    vertical-align: middle;
    margin: 0 3px;
}

.inline-input {
    display: inline-block;
    width: auto;
    min-width: 80px;
    padding: 4px 8px;
    margin: 0;
    font-size: 15px;
    font-weight: bold;
    border: 2px solid #2d6cdf;
    border-radius: 6px;
    background: #fff;
    color: #333;
    outline: none;
    text-align: center;
    box-sizing: content-box;
}

/* 채점 상태 스타일 */
.inline-input.status-correct {
    background-color: #e8f0fe;
    border-color: #2d6cdf;
    color: #2d6cdf;
    font-weight: bold;
}

.inline-input.status-wrong {
    background-color: #fce8e6;
    border-color: #d93025;
    color: #d93025;
}

.inline-wrong-hint {
    font-size: 13px;
    font-weight: bold;
    color: #d93025;
    margin-left: 4px;
    white-space: nowrap;
}

.blankSymbol {
    display: inline-block;
    color: #2d6cdf;
    font-weight: bold;
    border-bottom: 2px solid #2d6cdf;
    padding: 0 4px;
    margin: 0 2px;
}

.hidden { display: none !important; }
small { color: gray; font-size: 12px; }

/* DBグループ */
.group {
    margin-bottom: 15px;
    padding: 10px;
    border-radius: 8px;
    background: #f9f9f9;
}

.group-title {
    font-weight: bold;
    font-size: 15px;
    color: #2d6cdf;
    margin-bottom: 5px;
}

#examOut {
    padding-bottom: 60px;
}

/* 下部固定ボタンバー */
.gradeBar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(5px);
    padding: 12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom)); 
    box-shadow: 0 -3px 15px rgba(0,0,0,0.1);
    z-index: 999;
    display: flex;
    justify-content: center;
    box-sizing: border-box;
}

.gradeBar button {
    width: 90%;
    font-size: 16px;
    padding: 14px;
    margin-top: 0;
    transition: width 0.2s ease;
}

.gradeBar button.half {
    width: 47%;
}

/* 📱 修正用 モーダル */
.modal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
}

.modal-content {
    background: white;
    width: 90%;
    max-width: 500px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}
.modal-actions button {
    flex: 1;
}
</style>
</head>

<body>

<div class="top">📦 SLOT EXAM SYSTEM v16.0</div>

<!-- タブ切り替え -->
<div class="tab">
<button id="btnDB" class="active">📚 データベース</button>
<button id="btnExam">🎯 穴埋め試験</button>
</div>

<!-- ================= DB管理画面 ================= -->
<div id="dbArea" class="card">
<h3>📥 問題登録</h3>
<input id="caseName" placeholder="判例名・事件名">
<input id="note" placeholder="解説・注意点など">
<input id="tags" placeholder="タグ (カンマ(,)で複数入力可. 例: 人身の自由, 集会の自由)">
<textarea id="qText" rows="5" placeholder="問題文 ( 空欄: {正解} / 強調: **テキスト** )"></textarea>
<button id="btnAddQ">追加する</button>
<hr>
<button id="btnToggleDB">📚 登録問題の一覧 表示/非表示</button>
<div id="dbView" class="hidden"></div>
</div>

<!-- ================= 試験画面 ================= -->
<div id="examArea" class="card hidden">
<h3>🎯 試験作成</h3>
<div class="tab">
<button id="modeTag" class="active">タグ別</button>
<button id="modeCase">判例別</button>
</div>

<!-- タグ別モード -->
<div id="tagMode">
    <span class="form-label">🏷️ タグを選択 (出題範囲)</span>
    <select id="tagSelect"></select>
    
    <span class="form-label">📝 出題問題数</span>
    <input id="count" type="number" pattern="[0-9]*" placeholder="出題問題数">
    <button id="btnStartTag">試験開始</button>
</div>

<!-- 判例別モード -->
<div id="caseMode" class="hidden">
    <span class="form-label">📘 判例を選択</span>
    <select id="caseSelect"></select>
    <button id="btnStartCase">試験開始</button>
</div>

<div id="examOut"></div>
</div>

<!-- 下部固定操作バー -->
<div id="examCtrlArea" class="gradeBar hidden">
    <button id="btnGrade" style="background: #27ae60;">🎯 答え合わせ（採点）</button>
    <button id="btnRetryWrong" class="hidden" style="background: #e67e22; margin-left: 10px;">🔁 誤答のみ再出題</button>
</div>

<!-- 📱 修正モーダル -->
<div id="editModal" class="modal" style="display: none;">
    <div class="modal-content">
        <h3>✏️ 問題の修正</h3>
        <input id="editCaseName" placeholder="判例名・事件名">
        <input id="editNote" placeholder="解説・注意点など">
        <input id="editTags" placeholder="タグ (カンマで区切る)">
        <textarea id="editQText" rows="6" placeholder="問題文"></textarea>
        <div class="modal-actions">
            <button id="btnCancelEdit" style="background: #95a5a6;">キャンセル</button>
            <button id="btnSaveEdit" style="background: #27ae60;">保存する</button>
        </div>
    </div>
</div>

<!-- ================= JAVASCRIPT ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCXguxQRx0qF0hhPZ0HXRO3gYXea9HJjao",
    authDomain: "const-slot.firebaseapp.com",
    projectId: "const-slot",
    storageBucket: "const-slot.firebasestorage.app",
    messagingSenderId: "396005964783",
    appId: "1:396005964783:web:de2fa4d6928b6ab756541a"
};

const app = initializeApp(firebaseConfig);
const dbInstance = getFirestore(app);
const docRef = doc(dbInstance, "exams", "slot_db_doc");

let db = []; 
let currentTest = [];
let examMode = "tag";
let editingIndex = null; 

const circNums = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮","⑯","⑰","⑱","⑲","⑯"];
function getCircNum(index) {
    return circNums[index] || `(${index + 1})`;
}

onSnapshot(docRef, (docSnap) => {
    if (docSnap.exists()) {
        const data = docSnap.data();
        db = data.questions ? data.questions : [];
    } else {
        db = [];
    }
    renderDB();
    refreshDropdowns();
});

async function saveToFirestore(newData) {
    try {
        await setDoc(docRef, { questions: newData });
    } catch (error) {
        console.error("Error saving data:", error);
    }
}

function refreshDropdowns() {
    renderCaseSelect();
    renderTagSelect();
}

function formatText(str) {
    if (!str) return "";
    return str
        .replace(/\*\*(.*?)\*\*/g, "<b>$1</b>")
        .replace(/\n/g, "<br>");
}

/* ================= タブ切り替え ================= */
function showTab(tab) {
    const dbArea = document.getElementById("dbArea");
    const examArea = document.getElementById("examArea");
    const btnDB = document.getElementById("btnDB");
    const btnExam = document.getElementById("btnExam");

    if (tab === "db") {
        dbArea.classList.remove("hidden");
        examArea.classList.add("hidden");
        btnDB.classList.add("active");
        btnExam.classList.remove("active");
        document.getElementById("examCtrlArea").classList.add("hidden"); 
        renderDB();
    } else {
        examArea.classList.remove("hidden");
        dbArea.classList.add("hidden");
        btnExam.classList.add("active");
        btnDB.classList.remove("active");
        refreshDropdowns();
        if (currentTest.length > 0) {
            document.getElementById("examCtrlArea").classList.remove("hidden");
        }
    }
}

/* ================= データベース管理 ================= */
function toggleDB() {
    document.getElementById("dbView").classList.toggle("hidden");
}

function parseTags(tagStr) {
    if (!tagStr) return [];
    return tagStr.split(",").map(t => t.trim()).filter(t => t.length > 0);
}

function addQ() {
    const caseName = document.getElementById("caseName").value;
    const note = document.getElementById("note").value;
    const tagStr = document.getElementById("tags").value;
    const question = document.getElementById("qText").value;

    if (!question.trim()) return;

    let answers = [...question.matchAll(/\{(.*?)\}/g)].map(m => m[1]);
    let tags = parseTags(tagStr);

    db.push({
        id: db.length + 1,
        caseName,
        note,
        tags,
        question,
        answers
    });

    saveToFirestore(db);

    document.getElementById("caseName").value = "";
    document.getElementById("note").value = "";
    document.getElementById("tags").value = "";
    document.getElementById("qText").value = "";
}

function deleteQ(index) {
    if(!confirm("本当に削除しますか？")) return;
    db.splice(index, 1);
    db = db.map((q, i) => ({ ...q, id: i + 1 }));
    saveToFirestore(db);
}

function openEditModal(index) {
    editingIndex = index;
    const q = db[index];
    document.getElementById("editCaseName").value = q.caseName || "";
    document.getElementById("editNote").value = q.note || "";
    document.getElementById("editTags").value = q.tags ? q.tags.join(", ") : "";
    document.getElementById("editQText").value = q.question || "";
    document.getElementById("editModal").style.display = "flex";
}

function closeEditModal() {
    document.getElementById("editModal").style.display = "none";
    editingIndex = null;
}

function saveEdit() {
    if (editingIndex === null) return;
    
    const question = document.getElementById("editQText").value;
    if (!question.trim()) return;

    let answers = [...question.matchAll(/\{(.*?)\}/g)].map(m => m[1]);
    
    db[editingIndex].caseName = document.getElementById("editCaseName").value;
    db[editingIndex].note = document.getElementById("editNote").value;
    db[editingIndex].tags = parseTags(document.getElementById("editTags").value);
    db[editingIndex].question = question;
    db[editingIndex].answers = answers;

    saveToFirestore(db);
    closeEditModal();
}

function renderDB() {
    let grouped = {};

    db.forEach((q, idx) => {
        if (!q) return; 
        let key = q.caseName || "未分類";
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push({ ...q, _idx: idx });
    });

    let sortedKeys = Object.keys(grouped).sort((a, b) => {
        if (a === "未分類") return 1;
        if (b === "未分類") return -1;
        return a.localeCompare(b, 'ja');
    });

    let html = "";
    sortedKeys.forEach(group => {
        html += `<div class="group"><div class="group-title">${group}</div>`;
        grouped[group].forEach(q => {
            let tagHtml = q.tags ? q.tags.map(t => `<span class="tag-badge">#${t}</span>`).join("") : "";
            let noteHtml = q.note ? `<small>${formatText(q.note)}</small><br>` : "";
            
            let idxCounter = 0;
            let formattedQ = formatText(q.question).replace(/\{.*?\}/g, () => {
                let num = getCircNum(idxCounter++);
                return `<span class="blankSymbol">${num} ___</span>`;
            });

            html += `
            <div class="question">
                <div style="float:right; display:flex; gap:5px;">
                    <button class="btn-edit-q" data-idx="${q._idx}" style="background:#f39c12; padding:5px 8px; font-size:12px; color:white; border:none; border-radius:4px; cursor:pointer; margin:0;">修正</button>
                    <button class="btn-delete" data-idx="${q._idx}" style="background:red; padding:5px 8px; font-size:12px; color:white; border:none; border-radius:4px; cursor:pointer; margin:0;">削除</button>
                </div>
                ${noteHtml}
                ${formattedQ}<br>
                ${tagHtml}
            </div>`;
        });
        html += `</div>`;
    });

    document.getElementById("dbView").innerHTML = html;

    document.querySelectorAll(".btn-delete").forEach(btn => {
        btn.addEventListener("click", (e) => deleteQ(parseInt(e.target.getAttribute("data-idx"))));
    });
    document.querySelectorAll(".btn-edit-q").forEach(btn => {
        btn.addEventListener("click", (e) => openEditModal(parseInt(e.target.getAttribute("data-idx"))));
    });
}

/* ================= モード設定 ================= */
function setExamMode(mode) {
    examMode = mode;
    const tagMode = document.getElementById("tagMode");
    const caseMode = document.getElementById("caseMode");
    const btnTag = document.getElementById("modeTag");
    const btnCase = document.getElementById("modeCase");

    if (mode === "tag") {
        tagMode.classList.remove("hidden");
        caseMode.classList.add("hidden");
        btnTag.classList.add("active");
        btnCase.classList.remove("active");
    } else {
        tagMode.classList.add("hidden");
        caseMode.classList.remove("hidden");
        btnCase.classList.add("active");
        btnTag.classList.remove("active");
    }
    refreshDropdowns();
}

function renderCaseSelect() {
    const select = document.getElementById("caseSelect");
    let cases = [...new Set(db.filter(q => q).map(q => q.caseName || "未分類"))];
    
    cases.sort((a, b) => {
        if (a === "未分類") return 1;
        if (b === "未分類") return -1;
        return a.localeCompare(b, 'ja');
    });

    select.innerHTML = cases.map(c => `<option value="${c}">${c}</option>`).join("");
}

function renderTagSelect() {
    const select = document.getElementById("tagSelect");
    const filteredDb = db.filter(q => q);
    
    let tagCounts = {};
    filteredDb.forEach(q => {
        if (q.tags && q.tags.length > 0) {
            q.tags.forEach(t => {
                tagCounts[t] = (tagCounts[t] || 0) + 1;
            });
        }
    });

    let totalQuestions = filteredDb.length;
    let html = `<option value="all">🌐 全体プール (${totalQuestions}問)</option>`;

    Object.keys(tagCounts).sort((a,b) => a.localeCompare(b, 'ja')).forEach(t => {
        html += `<option value="${t}">#${t} (${tagCounts[t]}問)</option>`;
    });

    select.innerHTML = html;
}

/* ================= 試験生成 & シャッフル ================= */
function shuffle(arr) {
    let a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function resetGradeButtons() {
    document.getElementById("btnRetryWrong").classList.add("hidden");
    const btnGrade = document.getElementById("btnGrade");
    btnGrade.className = ""; 
    btnGrade.style.width = "90%";
    document.getElementById("examCtrlArea").classList.remove("hidden");
}

function prepareTestData(rawList) {
    return rawList.map(q => ({
        ...q,
        solvedStatus: new Array(q.answers.length).fill(false),
        userAnswers: new Array(q.answers.length).fill("")
    }));
}

function makeTagTest() {
    let n = parseInt(document.getElementById("count").value || "1");
    const selectedTag = document.getElementById("tagSelect").value;
    
    let pool = db.filter(q => q);

    if (selectedTag !== "all") {
        pool = pool.filter(q => q.tags && q.tags.includes(selectedTag));
    }

    if (pool.length === 0) {
        alert("該当する問題がありません。");
        return;
    }

    let selectedQuestions = shuffle(pool).slice(0, n);
    currentTest = prepareTestData(selectedQuestions);
    
    let title = selectedTag === "all" ? `🎯 ランダム試験 [全体] (${currentTest.length}問)` : `🏷️ タグ別試験 [#${selectedTag}] (${currentTest.length}問)`;
    renderExam(currentTest, title);
    resetGradeButtons();
}

function makeCaseTest() {
    const selectEl = document.getElementById("caseSelect");
    if(!selectEl.value) return;
    let selected = selectEl.value;
    let selectedQuestions = db.filter(q => q && (q.caseName || "未分類") === selected);
    currentTest = prepareTestData(selectedQuestions);
    renderExam(currentTest, `📘 判例別試験: ${selected}`);
    resetGradeButtons();
}

/* 💡 試験画面レンダリング (인라인 입력창 방식) */
function renderExam(testData, title) {
    let html = "";
    html += `<div class="examSession"><div class="examHeader">${title}</div>`;

    testData.forEach((q, i) => {
        let formattedQ = formatText(q.question);
        
        let blankIndex = 0;
        let masked = formattedQ.replace(/\{.*?\}/g, () => {
            let num = getCircNum(blankIndex);
            let isSolved = q.solvedStatus && q.solvedStatus[blankIndex];
            let ansText = q.answers[blankIndex];
            let userAns = q.userAnswers ? q.userAnswers[blankIndex] : "";
            let idx = blankIndex;
            blankIndex++;

            // 정답 길이에 따라 입력창 너비 동적 계산
            let inputWidth = Math.max(ansText.length * 16 + 20, 70);

            if (isSolved) {
                return `<span class="inline-blank-container">
                    <input class="inline-input status-correct" style="width:${inputWidth}px;" value="${ansText}" disabled readonly>
                </span>`;
            } else {
                let statusClass = userAns ? "status-wrong" : "";
                let hintHtml = userAns ? `<span class="inline-wrong-hint">(${ansText})</span>` : "";
                
                return `<span class="inline-blank-container">
                    <input class="inline-input ${statusClass}" id="ans_${i}_${idx}" style="width:${inputWidth}px;" placeholder="${num}" value="${userAns}" enterkeyhint="next">
                    ${hintHtml}
                </span>`;
            }
        });

        let tagHtml = q.tags && q.tags.length > 0 
            ? `<div style="margin-bottom: 5px;">${q.tags.map(t => `<span class="tag-badge">#${t}</span>`).join("")}</div>` 
            : "";
        let noteHtml = q.note ? `<small>${formatText(q.note)}</small><br>` : "";

        html += `
        <div class="question">
            <b>${i + 1}. ${q.caseName || ""}</b><br>
            ${tagHtml}
            ${noteHtml}
            ${masked}
        </div>`;
    });

    html += `</div>`;
    document.getElementById("examOut").innerHTML = html;

    setTimeout(() => {
        const firstInput = document.querySelector(".inline-input:not([disabled])");
        if (firstInput) firstInput.focus();
        bindInputEvents();
    }, 100);
}

function bindInputEvents() {
    const inputs = Array.from(document.querySelectorAll(".inline-input:not([disabled])"));
    inputs.forEach((input, index) => {
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                const nextInput = inputs[index + 1];
                if (nextInput) nextInput.focus();
                else input.blur();
            }
        });
    });
}

/* ================= 答え合わせ（採点） ================= */
function grade() {
    if (currentTest.length === 0) return;

    let hasWrong = false;

    currentTest.forEach((q, i) => {
        for (let j = 0; j < q.answers.length; j++) {
            if (q.solvedStatus && q.solvedStatus[j]) continue;

            const inputEl = document.getElementById(`ans_${i}_${j}`);
            if (!inputEl) continue;

            let user = (inputEl.value || "").trim();
            let correct = q.answers[j].trim();

            q.userAnswers[j] = user;

            if (user === correct) {
                q.solvedStatus[j] = true;
            } else {
                hasWrong = true;
            }
        }
    });

    renderExam(currentTest, document.querySelector(".examHeader").innerText);

    if (hasWrong) {
        const btnGrade = document.getElementById("btnGrade");
        btnGrade.className = "half";
        btnGrade.style.width = "47%";
        document.getElementById("btnRetryWrong").classList.remove("hidden");
    } else {
        alert("満点です！お見事！");
        resetGradeButtons();
    }
}

/* ================= 間違えた問題のみ再出題 ================= */
function retryWrongTests() {
    let wrongQuestions = [];

    currentTest.forEach((q) => {
        let hasUnsolved = q.solvedStatus.some(status => status === false);
        if (hasUnsolved) {
            // 틀린 항목의 이전 사용자 입력값 초기화
            q.userAnswers = q.userAnswers.map((ans, idx) => q.solvedStatus[idx] ? ans : "");
            wrongQuestions.push(q);
        }
    });

    if (wrongQuestions.length > 0) {
        currentTest = wrongQuestions;
        renderExam(currentTest, `🔁 誤答復習試験 (${currentTest.length}問)`);
        resetGradeButtons();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

document.getElementById("btnAddQ").addEventListener("click", addQ);
document.getElementById("modeTag").addEventListener("click", () => setExamMode("tag"));
document.getElementById("modeCase").addEventListener("click", () => setExamMode("case"));
document.getElementById("btnStartTag").addEventListener("click", makeTagTest);
document.getElementById("btnStartCase").addEventListener("click", makeCaseTest);
document.getElementById("btnGrade").addEventListener("click", grade);
document.getElementById("btnRetryWrong").addEventListener("click", retryWrongTests);

document.getElementById("btnCancelEdit").addEventListener("click", closeEditModal);
document.getElementById("btnSaveEdit").addEventListener("click", saveEdit);
