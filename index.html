<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>法学 判例穴埋め試験 SYSTEM v17.8</title>

<style>
body {
    font-family: -apple-system, "Helvetica Neue", "Segoe UI", sans-serif;
    background: #fbfbfc;
    margin: 0;
    padding: 15px;
    padding-bottom: 90px; 
    -webkit-text-size-adjust: 100%;
    color: #333;
}

.top {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
    color: #c2410c;
}

/* 🏛️ 최상위 7법 과목 선택 탭 */
.subject-tab {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    background: #f3f4f6;
    padding: 6px;
    border-radius: 10px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

.subject-tab::-webkit-scrollbar {
    display: none;
}

.subject-tab button {
    flex: 0 0 auto;
    padding: 9px 13px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: #6b7280;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    margin-top: 0;
    transition: all 0.2s ease;
}

.subject-tab button.active {
    background: #ea580c;
    color: white;
    box-shadow: 0 2px 6px rgba(234, 88, 12, 0.25);
}

/* 카드 */
.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border: 1px solid #f3f4f6;
}

/* 機能 タブ */
.tab {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}

.tab button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #e5e7eb;
    color: #4b5563;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 0;
    transition: background 0.2s ease;
}

.tab button.active {
    background: #f97316;
    color: white;
    box-shadow: 0 2px 5px rgba(249, 115, 22, 0.2);
}

/* 入力項目 */
textarea, input, select {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid #d1d5db;
    box-sizing: border-box;
    font-size: 16px; 
    transition: border-color 0.2s ease;
}

textarea:focus, input:focus, select:focus {
    outline: none;
    border-color: #f97316;
}

.form-label {
    font-size: 13px;
    font-weight: bold;
    color: #6b7280;
    margin-top: 10px;
    display: block;
}

button {
    padding: 12px;
    margin-top: 8px;
    border: none;
    border-radius: 8px;
    background: #ea580c;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s ease;
}

button:active {
    opacity: 0.9;
}

/* 問題表示 */
.question {
    padding: 15px;
    border-left: 4px solid #f97316;
    background: #fafaf9;
    margin-top: 12px;
    font-size: 15px;
    line-height: 1.8;
    position: relative;
    border-radius: 0 8px 8px 0;
}

/* 문제 본문 전용 스타일 */
.q-body {
    white-space: pre-wrap;
    margin-top: 6px;
}

/* 🏷️ 헤더 및 리스트 서식 스타일 (###, ##, #, -) - 강제 개행 없음 */
.custom-h1 {
    font-size: 25px;
    font-weight: bold;
    color: #9a3412;
    line-height: 1.4;
}

.custom-h2 {
    font-size: 22px;
    font-weight: bold;
    color: #c2410c;
    line-height: 1.4;
}

.custom-h3 {
    display: inline-block;
    font-size: 18px;
    font-weight: bold;
    color: #ea580c;
    padding-left: 0.75em; /* 기존 1.5em에서 절반으로 축소 */
    line-height: 1.4;
}

.custom-list {
    font-weight: bold;
}

.tag-badge {
    display: inline-block;
    background: #ffedd5;
    color: #c2410c;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 12px;
    margin-right: 5px;
    margin-top: 4px;
    font-weight: bold;
}

/* 인라인 빈칸 입력창 */
.inline-blank-container {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    vertical-align: middle;
    margin: 0 3px;
    max-width: 100%;
}

.inline-input {
    display: inline-block;
    width: auto;
    min-width: 80px;
    max-width: 100%;
    padding: 4px 8px;
    margin: 0;
    font-size: 15px;
    font-weight: bold;
    border: 2px solid #f97316;
    border-radius: 6px;
    background: #fff;
    color: #333;
    outline: none;
    text-align: center;
    box-sizing: border-box;
}

/* 채점 상태 스타일 */
.inline-input.status-correct {
    background-color: #fff7ed;
    border-color: #ea580c;
    color: #ea580c;
    font-weight: bold;
}

.inline-input.status-wrong {
    background-color: #fef2f2;
    border-color: #dc2626;
    color: #dc2626;
}

/* 오답 정답 힌트 */
.inline-wrong-hint {
    font-size: 13px;
    font-weight: bold;
    color: #dc2626;
    margin-left: 4px;
    white-space: normal;
    word-break: break-all;
    display: inline;
}

.blankSymbol {
    display: inline-block;
    color: #ea580c;
    font-weight: bold;
    border-bottom: 2px solid #ea580c;
    padding: 0 4px;
    margin: 0 2px;
}

.hidden { display: none !important; }
small { color: #78716c; font-size: 12px; }

/* DBグループ */
.group {
    margin-bottom: 15px;
    padding: 10px;
    border-radius: 8px;
    background: #fdfdfd;
    border: 1px solid #f3f4f6;
}

.group-title {
    font-weight: bold;
    font-size: 15px;
    color: #ea580c;
    margin-bottom: 5px;
}

#examOut {
    padding-bottom: 60px;
}

/* 下部固定ボタンバー */
.gradeBar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(8px);
    padding: 12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom)); 
    box-shadow: 0 -3px 15px rgba(0,0,0,0.08);
    z-index: 999;
    display: flex;
    justify-content: center;
    box-sizing: border-box;
}

.gradeBar button {
    width: 90%;
    font-size: 16px;
    padding: 14px;
    margin-top: 0;
    transition: width 0.2s ease;
}

.gradeBar button.half {
    width: 47%;
}

/* 📱 修正用 モーダル */
.modal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
}

.modal-content {
    background: white;
    width: 90%;
    max-width: 500px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}
.modal-actions button {
    flex: 1;
}
</style>
</head>

<body>

<div class="top">📦 法学 穴埋め試験 SYSTEM v17.8</div>

<!-- 🏛️ 7법 최상위 과목 탭 -->
<div class="subject-tab">
    <button class="btn-subject active" data-subject="constitution" data-title="憲法">📜 憲法</button>
    <button class="btn-subject" data-subject="admin" data-title="行政法">🏛️ 行政法</button>
    <button class="btn-subject" data-subject="civil" data-title="民法">📘 民法</button>
    <button class="btn-subject" data-subject="civ_pro" data-title="民事訴訟法">📑 民訴法</button>
    <button class="btn-subject" data-subject="comm" data-title="商法">🏢 商法</button>
    <button class="btn-subject" data-subject="penal" data-title="刑法">📕 刑法</button>
    <button class="btn-subject" data-subject="crim_pro" data-title="刑事訴訟法">⚖️ 刑訴法</button>
</div>

<!-- 機能 タブ -->
<div class="tab">
<button id="btnDB" class="active">📚 データベース</button>
<button id="btnExam">🎯 穴埋め試験</button>
</div>

<!-- ================= DB管理画面 ================= -->
<div id="dbArea" class="card">
<h3 id="dbTitle" style="color: #c2410c; margin-top:0;">📥 [憲法] 問題登録</h3>
<input id="caseName" placeholder="講義題名名">
<input id="tags" placeholder="タグ (カンマ(,)で複数入力可. 例: 人身の自由, 集会の自由)">
<textarea id="qText" rows="6" placeholder="問題文&#10;### 大見出し (# 表示, 25px)&#10;## 主題 (22px, 自動1., 2.)&#10;# 小主題 (18px, 自動1.1., インデント)&#10;- 項目 (太字, 自動(1) )&#10;空欄: {正解} / 強調: **テキスト**"></textarea>
<button id="btnAddQ">追加する</button>
<hr style="border: 0; border-top: 1px solid #f3f4f6; margin: 15px 0;">
<button id="btnToggleDB" style="background:#78716c;">📚 登録問題の一覧 表示/非表示</button>
<div id="dbView" class="hidden"></div>
</div>

<!-- ================= 試験画面 ================= -->
<div id="examArea" class="card hidden">
<h3 id="examTitle" style="color: #c2410c; margin-top:0;">🎯 [憲法] 試験作成</h3>
<div class="tab">
<button id="modeTag" class="active">タグ別</button>
<button id="modeCase">判例別</button>
</div>

<!-- タグ別モード -->
<div id="tagMode">
    <span class="form-label">🏷️ タグを選択 (出題範囲)</span>
    <select id="tagSelect"></select>
    
    <span class="form-label">📝 出題問題数</span>
    <input id="count" type="number" pattern="[0-9]*" placeholder="出題問題数">
    <button id="btnStartTag">試験開始</button>
</div>

<!-- 判例別モード -->
<div id="caseMode" class="hidden">
    <span class="form-label">📘 判例を選択</span>
    <select id="caseSelect"></select>
    <button id="btnStartCase">試験開始</button>
</div>

<div id="examOut"></div>
</div>

<!-- 下部固定操作バー -->
<div id="examCtrlArea" class="gradeBar hidden">
    <button id="btnGrade" style="background: #16a34a;">🎯 答え合わせ（採点）</button>
    <button id="btnRetryWrong" class="hidden" style="background: #ea580c; margin-left: 10px;">🔁 誤答のみ再出題</button>
</div>

<!-- 📱 修正モーダル -->
<div id="editModal" class="modal" style="display: none;">
    <div class="modal-content">
        <h3 style="color: #c2410c; margin-top:0;">✏️ 問題の修正</h3>
        <input id="editCaseName" placeholder="判例名・事件名">
        <input id="editTags" placeholder="タグ (カンマで区切る)">
        <textarea id="editQText" rows="6" placeholder="問題文"></textarea>
        <div class="modal-actions">
            <button id="btnCancelEdit" style="background: #9ca3af;">キャンセル</button>
            <button id="btnSaveEdit" style="background: #ea580c;">保存する</button>
        </div>
    </div>
</div>

<!-- ================= JAVASCRIPT ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCXguxQRx0qF0hhPZ0HXRO3gYXea9HJjao",
    authDomain: "const-slot.firebaseapp.com",
    projectId: "const-slot",
    storageBucket: "const-slot.firebasestorage.app",
    messagingSenderId: "396005964783",
    appId: "1:396005964783:web:de2fa4d6928b6ab756541a"
};

const app = initializeApp(firebaseConfig);
const dbInstance = getFirestore(app);

/* ================= 🏛️ 과목 상태 및 Firestore 연결 관리 ================= */
let currentSubject = "constitution";
let currentSubjectTitle = "憲法";
let docRef = null;
let unsubscribeDoc = null;

let db = []; 
let currentTest = [];
let examMode = "tag";
let editingIndex = null; 

function getCircNum(index) {
    return `(${index + 1})`;
}

function switchSubject(subjectKey, subjectTitle) {
    currentSubject = subjectKey;
    currentSubjectTitle = subjectTitle;

    document.getElementById("dbTitle").textContent = `📥 [${currentSubjectTitle}] 問題登録`;
    document.getElementById("examTitle").textContent = `🎯 [${currentSubjectTitle}] 試験作成`;

    if (unsubscribeDoc) {
        unsubscribeDoc();
    }

    if (currentSubject === "constitution") {
        docRef = doc(dbInstance, "exams", "slot_db_doc");
    } else if (currentSubject === "admin") {
        docRef = doc(dbInstance, "admin_exam", "slot_db_doc");
    } else {
        docRef = doc(dbInstance, "slot_exam_db", currentSubject);
    }

    currentTest = [];
    document.getElementById("examOut").innerHTML = "";
    document.getElementById("examCtrlArea").classList.add("hidden");

    unsubscribeDoc = onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
            const data = docSnap.data();
            db = data.questions ? data.questions : [];
        } else {
            db = [];
        }
        renderDB();
        refreshDropdowns();
    });
}

async function saveToFirestore(newData) {
    if (!docRef) return;
    try {
        await setDoc(docRef, { questions: newData });
    } catch (error) {
        console.error("Error saving data:", error);
    }
}

function refreshDropdowns() {
    renderCaseSelect();
    renderTagSelect();
}

/* ================= 💡 서식 파서 (###, ##, #, -) ================= */
function formatText(str) {
    if (!str) return "";
    
    let formatted = str.replace(/\*\*(.*?)\*\*/g, "<b>$1</b>");
    let lines = formatted.split("\n");

    let h2Count = 0;   // ## 주제 카운터
    let h3Count = 0;   // # 소주제 카운터
    let dashCount = 0; // - 항목 전체 카운터

    let resultLines = lines.map(line => {
        let trimmed = line.trim();

        // 1. ### 제목 룰 (# 하나 남김, 25px, Bold)
        if (trimmed.startsWith("###")) {
            let content = trimmed.replace(/^###\s?/, "");
            return `<span class="custom-h1"># ${content}</span>`;
        }
        
        // 2. ## 주제 룰 (22px, Bold, 순차적 1., 2. 넘버링)
        if (trimmed.startsWith("##")) {
            h2Count++;
            h3Count = 0;
            let content = trimmed.replace(/^##\s?/, "");
            return `<span class="custom-h2">${h2Count}. ${content}</span>`;
        }
        
        // 3. # 소주제 룰 (18px, Bold, 0.75em 패딩, 1.1., 1.2. 넘버링)
        if (trimmed.startsWith("#")) {
            h3Count++;
            let currentH2 = h2Count === 0 ? 1 : h2Count;
            let content = trimmed.replace(/^#\s?/, "");
            return `<span class="custom-h3">${currentH2}.${h3Count}. ${content}</span>`;
        }

        // 4. - 항목 룰 (주제/소주제 무관 전체 카운트 (1), (2) + 반각 스페이스 + Bold)
        if (trimmed.startsWith("-")) {
            dashCount++;
            let content = trimmed.replace(/^-\s?/, "");
            return `<span class="custom-list">(${dashCount}) ${content}</span>`;
        }

        return line;
    });

    return resultLines.join("\n");
}

/* ================= 🏛️ 과목 탭 전환 이벤트 ================= */
document.querySelectorAll(".btn-subject").forEach(btn => {
    btn.addEventListener("click", (e) => {
        document.querySelectorAll(".btn-subject").forEach(b => b.classList.remove("active"));
        const targetBtn = e.target.closest(".btn-subject");
        targetBtn.classList.add("active");
        
        const subj = targetBtn.getAttribute("data-subject");
        const title = targetBtn.getAttribute("data-title");
        switchSubject(subj, title);
    });
});

/* ================= 機能 タブ切り替え ================= */
function showTab(tab) {
    const dbArea = document.getElementById("dbArea");
    const examArea = document.getElementById("examArea");
    const btnDB = document.getElementById("btnDB");
    const btnExam = document.getElementById("btnExam");

    if (tab === "db") {
        dbArea.classList.remove("hidden");
        examArea.classList.add("hidden");
        btnDB.classList.add("active");
        btnExam.classList.remove("active");
        document.getElementById("examCtrlArea").classList.add("hidden"); 
        renderDB();
    } else {
        examArea.classList.remove("hidden");
        dbArea.classList.add("hidden");
        btnExam.classList.add("active");
        btnDB.classList.remove("active");
        refreshDropdowns();
        if (currentTest.length > 0) {
            document.getElementById("examCtrlArea").classList.remove("hidden");
        }
    }
}

/* ================= データベース管理 ================= */
function toggleDB() {
    document.getElementById("dbView").classList.toggle("hidden");
}

function parseTags(tagStr) {
    if (!tagStr) return [];
    return tagStr.split(",").map(t => t.trim()).filter(t => t.length > 0);
}

function addQ() {
    const caseName = document.getElementById("caseName").value;
    const tagStr = document.getElementById("tags").value;
    const question = document.getElementById("qText").value;

    if (!question.trim()) return;

    let answers = [...question.matchAll(/\{(.*?)\}/g)].map(m => m[1]);
    let tags = parseTags(tagStr);

    db.push({
        id: db.length + 1,
        caseName,
        tags,
        question,
        answers
    });

    saveToFirestore(db);

    document.getElementById("caseName").value = "";
    document.getElementById("tags").value = "";
    document.getElementById("qText").value = "";
}

function deleteQ(index) {
    if(!confirm("本当に削除しますか？")) return;
    db.splice(index, 1);
    db = db.map((q, i) => ({ ...q, id: i + 1 }));
    saveToFirestore(db);
}

function openEditModal(index) {
    editingIndex = index;
    const q = db[index];
    document.getElementById("editCaseName").value = q.caseName || "";
    document.getElementById("editTags").value = q.tags ? q.tags.join(", ") : "";
    document.getElementById("editQText").value = q.question || "";
    document.getElementById("editModal").style.display = "flex";
}

function closeEditModal() {
    document.getElementById("editModal").style.display = "none";
    editingIndex = null;
}

function saveEdit() {
    if (editingIndex === null) return;
    
    const question = document.getElementById("editQText").value;
    if (!question.trim()) return;

    let answers = [...question.matchAll(/\{(.*?)\}/g)].map(m => m[1]);
    
    db[editingIndex].caseName = document.getElementById("editCaseName").value;
    db[editingIndex].tags = parseTags(document.getElementById("editTags").value);
    db[editingIndex].question = question;
    db[editingIndex].answers = answers;

    saveToFirestore(db);
    closeEditModal();
}

function renderDB() {
    let grouped = {};

    db.forEach((q, idx) => {
        if (!q) return; 
        let key = q.caseName || "未分類";
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push({ ...q, _idx: idx });
    });

    let sortedKeys = Object.keys(grouped).sort((a, b) => {
        if (a === "未分類") return 1;
        if (b === "未分類") return -1;
        return a.localeCompare(b, 'ja');
    });

    let html = "";
    sortedKeys.forEach(group => {
        html += `<div class="group"><div class="group-title">${group}</div>`;
        grouped[group].forEach(q => {
            let tagHtml = q.tags && q.tags.length > 0 ? `<div>${q.tags.map(t => `<span class="tag-badge">#${t}</span>`).join("")}</div>` : "";
            
            let idxCounter = 0;
            let formattedQ = formatText(q.question).replace(/\{.*?\}/g, () => {
                let num = getCircNum(idxCounter++);
                return `<span class="blankSymbol">${num} ___</span>`;
            });

            html += `<div class="question"><div style="float:right; display:flex; gap:5px;"><button class="btn-edit-q" data-idx="${q._idx}" style="background:#f97316; padding:5px 8px; font-size:12px; color:white; border:none; border-radius:4px; cursor:pointer; margin:0;">修正</button><button class="btn-delete" data-idx="${q._idx}" style="background:#ef4444; padding:5px 8px; font-size:12px; color:white; border:none; border-radius:4px; cursor:pointer; margin:0;">削除</button></div>${tagHtml}<div class="q-body">${formattedQ}</div></div>`;
        });
        html += `</div>`;
    });

    document.getElementById("dbView").innerHTML = html;

    document.querySelectorAll(".btn-delete").forEach(btn => {
        btn.addEventListener("click", (e) => deleteQ(parseInt(e.target.getAttribute("data-idx"))));
    });
    document.querySelectorAll(".btn-edit-q").forEach(btn => {
        btn.addEventListener("click", (e) => openEditModal(parseInt(e.target.getAttribute("data-idx"))));
    });
}

/* ================= モード設定 ================= */
function setExamMode(mode) {
    examMode = mode;
    const tagMode = document.getElementById("tagMode");
    const caseMode = document.getElementById("caseMode");
    const btnTag = document.getElementById("modeTag");
    const btnCase = document.getElementById("modeCase");

    if (mode === "tag") {
        tagMode.classList.remove("hidden");
        caseMode.classList.add("hidden");
        btnTag.classList.add("active");
        btnCase.classList.remove("active");
    } else {
        tagMode.classList.add("hidden");
        caseMode.classList.remove("hidden");
        btnCase.classList.add("active");
        btnTag.classList.remove("active");
    }
    refreshDropdowns();
}

function renderCaseSelect() {
    const select = document.getElementById("caseSelect");
    let cases = [...new Set(db.filter(q => q).map(q => q.caseName || "未分類"))];
    
    cases.sort((a, b) => {
        if (a === "未分類") return 1;
        if (b === "未分類") return -1;
        return a.localeCompare(b, 'ja');
    });

    select.innerHTML = cases.map(c => `<option value="${c}">${c}</option>`).join("");
}

function renderTagSelect() {
    const select = document.getElementById("tagSelect");
    const filteredDb = db.filter(q => q);
    
    let tagCounts = {};
    filteredDb.forEach(q => {
        if (q.tags && q.tags.length > 0) {
            q.tags.forEach(t => {
                tagCounts[t] = (tagCounts[t] || 0) + 1;
            });
        }
    });

    let totalQuestions = filteredDb.length;
    let html = `<option value="all">🌐 全体プール (${totalQuestions}問)</option>`;

    Object.keys(tagCounts).sort((a,b) => a.localeCompare(b, 'ja')).forEach(t => {
        html += `<option value="${t}">#${t} (${tagCounts[t]}問)</option>`;
    });

    select.innerHTML = html;
}

/* ================= 試験生成 & シャッフル ================= */
function shuffle(arr) {
    let a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function resetGradeButtons() {
    document.getElementById("btnRetryWrong").classList.add("hidden");
    const btnGrade = document.getElementById("btnGrade");
    btnGrade.className = ""; 
    btnGrade.style.width = "90%";
    document.getElementById("examCtrlArea").classList.remove("hidden");
}

function prepareTestData(rawList) {
    return rawList.map(q => ({
        ...q,
        solvedStatus: new Array(q.answers.length).fill(false),
        userAnswers: new Array(q.answers.length).fill(null)
    }));
}

function makeTagTest() {
    let n = parseInt(document.getElementById("count").value || "1");
    const selectedTag = document.getElementById("tagSelect").value;
    
    let pool = db.filter(q => q);

    if (selectedTag !== "all") {
        pool = pool.filter(q => q.tags && q.tags.includes(selectedTag));
    }

    if (pool.length === 0) {
        alert("該当する問題がありません。");
        return;
    }

    let selectedQuestions = shuffle(pool).slice(0, n);
    currentTest = prepareTestData(selectedQuestions);
    
    let title = selectedTag === "all" 
        ? `🎯 [${currentSubjectTitle}] ランダム試験 [全体] (${currentTest.length}問)` 
        : `🏷️ [${currentSubjectTitle}] タグ別試験 [#${selectedTag}] (${currentTest.length}問)`;
    
    renderExam(currentTest, title);
    resetGradeButtons();
}

function makeCaseTest() {
    const selectEl = document.getElementById("caseSelect");
    if(!selectEl.value) return;
    let selected = selectEl.value;
    let selectedQuestions = db.filter(q => q && (q.caseName || "未分類") === selected);
    currentTest = prepareTestData(selectedQuestions);
    renderExam(currentTest, `📘 [${currentSubjectTitle}] 判例別試験: ${selected}`);
    resetGradeButtons();
}

/* 💡 試験画面レンダリング */
function renderExam(testData, title) {
    let html = "";
    html += `<div class="examSession"><div class="examHeader" style="font-size:16px; font-weight:bold; color:#ea580c; margin-bottom:12px;">${title}</div>`;

    testData.forEach((q, i) => {
        let formattedQ = formatText(q.question);
        
        let blankIndex = 0;
        let masked = formattedQ.replace(/\{.*?\}/g, () => {
            let num = getCircNum(blankIndex);
            let isSolved = q.solvedStatus && q.solvedStatus[blankIndex];
            let ansText = q.answers[blankIndex];
            let userAns = q.userAnswers ? q.userAnswers[blankIndex] : null;
            let idx = blankIndex;
            blankIndex++;

            let inputWidth = Math.max(ansText.length * 16 + 20, 70);

            if (isSolved) {
                return `<span class="inline-blank-container"><input class="inline-input status-correct" style="width:${inputWidth}px;" value="${ansText}" disabled readonly></span>`;
            } else {
                let isGraded = userAns !== null;
                let statusClass = isGraded ? "status-wrong" : "";
                let hintHtml = isGraded ? `<span class="inline-wrong-hint">(${ansText})</span>` : "";
                let displayVal = userAns === null ? "" : userAns;
                
                return `<span class="inline-blank-container"><input class="inline-input ${statusClass}" id="ans_${i}_${idx}" style="width:${inputWidth}px;" placeholder="${num}" value="${displayVal}" enterkeyhint="next">${hintHtml}</span>`;
            }
        });

        let tagHtml = q.tags && q.tags.length > 0 ? `<div>${q.tags.map(t => `<span class="tag-badge">#${t}</span>`).join("")}</div>` : "";

        html += `<div class="question"><b>${i + 1}. ${q.caseName || ""}</b>${tagHtml}<div class="q-body">${masked}</div></div>`;
    });

    html += `</div>`;
    document.getElementById("examOut").innerHTML = html;

    setTimeout(() => {
        const firstInput = document.querySelector(".inline-input:not([disabled])");
        if (firstInput) firstInput.focus();
        bindInputEvents();
    }, 100);
}

function bindInputEvents() {
    const inputs = Array.from(document.querySelectorAll(".inline-input:not([disabled])"));
    inputs.forEach((input, index) => {
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                const nextInput = inputs[index + 1];
                if (nextInput) nextInput.focus();
                else input.blur();
            }
        });
    });
}

/* ================= 答え合わせ（採点） ================= */
function grade() {
    if (currentTest.length === 0) return;

    let hasWrong = false;

    currentTest.forEach((q, i) => {
        for (let j = 0; j < q.answers.length; j++) {
            if (q.solvedStatus && q.solvedStatus[j]) continue;

            const inputEl = document.getElementById(`ans_${i}_${j}`);
            if (!inputEl) continue;

            let user = (inputEl.value || "").trim();
            let correct = q.answers[j].trim();

            q.userAnswers[j] = user;

            if (user === correct && user !== "") {
                q.solvedStatus[j] = true;
            } else {
                hasWrong = true;
            }
        }
    });

    renderExam(currentTest, document.querySelector(".examHeader").innerText);

    if (hasWrong) {
        const btnGrade = document.getElementById("btnGrade");
        btnGrade.className = "half";
        btnGrade.style.width = "47%";
        document.getElementById("btnRetryWrong").classList.remove("hidden");
    } else {
        alert("満点です！お見事！");
        resetGradeButtons();
    }
}

/* ================= 間違えた問題のみ再出題 ================= */
function retryWrongTests() {
    let wrongQuestions = [];

    currentTest.forEach((q) => {
        let hasUnsolved = q.solvedStatus.some(status => status === false);
        if (hasUnsolved) {
            q.userAnswers = q.userAnswers.map((ans, idx) => q.solvedStatus[idx] ? ans : null);
            wrongQuestions.push(q);
        }
    });

    if (wrongQuestions.length > 0) {
        currentTest = wrongQuestions;
        renderExam(currentTest, `🔁 [${currentSubjectTitle}] 誤答復習試験 (${currentTest.length}問)`);
        resetGradeButtons();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}
