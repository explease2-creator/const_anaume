<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Slot Exam System v13.1 (Modal Fixed)</title>

<style>
body {
    font-family: -apple-system, "Helvetica Neue", "Segoe UI", sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 15px;
    padding-bottom: 90px; 
    -webkit-text-size-adjust: 100%;
}

.top {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

/* 카드 */
.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/* タブ */
.tab {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}

.tab button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #ddd;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.tab button.active {
    background: #2d6cdf;
    color: white;
}

/* 入力項目 */
textarea, input, select {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid #ccc;
    box-sizing: border-box;
    font-size: 16px; 
}

button {
    padding: 12px;
    margin-top: 8px;
    border: none;
    border-radius: 8px;
    background: #2d6cdf;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

/* 問題表示 */
.question {
    padding: 12px;
    border-left: 4px solid #2d6cdf;
    background: #fafafa;
    margin-top: 12px;
    font-size: 15px;
    line-height: 1.6;
    position: relative;
}

.tag-badge {
    display: inline-block;
    background: #e1ecf8;
    color: #2d6cdf;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 12px;
    margin-right: 5px;
    margin-top: 5px;
    font-weight: bold;
}

/* 空欄ボックス */
.blankBox {
    display: inline-block;
    width: 60px;
    height: 16px;
    border-bottom: 2px solid #333;
    margin: 0 4px;
    vertical-align: middle;
}

/* 解答エリア */
.answerRow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
    flex-wrap: wrap;
}

.answerBox {
    flex: 1;
    min-width: 150px;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 15px;
}

.result {
    width: 30px;
    text-align: center;
    font-weight: bold;
    font-size: 18px;
}

.ok { color: green; }
.no { color: red; }

/* 💡 인라인 스타일보다 확실하게 숨김을 강제하기 위한 !important 주입 */
.hidden { display: none !important; }
small { color: gray; font-size: 12px; }

/* DBグループ */
.group {
    margin-bottom: 15px;
    padding: 10px;
    border-radius: 8px;
    background: #f9f9f9;
}

.group-title {
    font-weight: bold;
    font-size: 15px;
    color: #2d6cdf;
    margin-bottom: 5px;
}

/* 誤答ヒント */
.wrongHint {
    margin-top: 6px;
    padding: 8px;
    font-size: 13px;
    color: #d33;
    border-left: 3px solid red;
    background: #fff3f3;
    border-radius: 4px;
    width: 100%; 
    box-sizing: border-box;
}

#examOut {
    padding-bottom: 60px;
}

/* 下部固定ボタンバー */
.gradeBar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(5px);
    padding: 12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom)); 
    box-shadow: 0 -3px 15px rgba(0,0,0,0.1);
    z-index: 999;
    display: flex;
    justify-content: center;
    box-sizing: border-box;
}

.gradeBar button {
    width: 90%;
    font-size: 16px;
    padding: 14px;
    margin-top: 0;
    transition: width 0.2s ease;
}

.gradeBar button.half {
    width: 47%;
}

/* 📱 修正用 モダル */
.modal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
}

.modal-content {
    background: white;
    width: 90%;
    max-width: 500px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}
.modal-actions button {
    flex: 1;
}
</style>
</head>

<body>

<div class="top">📦 SLOT EXAM SYSTEM v13.1</div>

<div class="tab">
<button id="btnDB" class="active">📚 データベース</button>
<button id="btnExam">🎯 穴埋め試験</button>
</div>

<div id="dbArea" class="card">
<h3>📥 問題登録</h3>
<input id="caseName" placeholder="判例名・事件名">
<input id="note" placeholder="解説・注意点など">
<input id="tags" placeholder="タグ (カンマ(,)で複数入力可. 例: 인신의자유, 집회의자유)">
<textarea id="qText" placeholder="問題文 ( 空欄にしたい部分を {正解} のように囲んで入力 )"></textarea>
<button id="btnAddQ">追加する</button>
<hr>
<button id="btnToggleDB">📚 登録問題の一覧 表示/非表示</button>
<div id="dbView" class="hidden"></div>
</div>

<div id="examArea" class="card hidden">
<h3>🎯 試験作成</h3>
<div class="tab">
<button id="modeRandom" class="active">ランダム</button>
<button id="modeCase">判例別</button>
<button id="modeTag">タグ別</button>
</div>

<div id="randomMode">
    <input id="count" type="number" pattern="[0-9]*" placeholder="出題問題数">
    <button id="btnStartRandom">試験開始</button>
</div>

<div id="caseMode" class="hidden">
    <select id="caseSelect"></select>
    <button id="btnStartCase">試験開始</button>
</div>

<div id="tagMode" class="hidden">
    <select id="tagSelect"></select>
    <button id="btnStartTag">試験開始</button>
</div>

<div id="examOut"></div>
</div>

<div id="examCtrlArea" class="gradeBar hidden">
    <button id="btnGrade" style="background: #27ae60;">🎯 答え合わせ（採点）</button>
    <button id="btnRetryWrong" class="hidden" style="background: #e67e22; margin-left: 10px;">🔁 誤答のみ再出題</button>
</div>

<div id="editModal" class="modal" style="display: none;">
    <div class="modal-content">
        <h3>✏️ 問題の修正</h3>
        <input id="editCaseName" placeholder="判例名・事件名">
        <input id="editNote" placeholder="解説・注意点など">
        <input id="editTags" placeholder="タグ (カンマで区切る)">
        <textarea id="editQText" rows="6" placeholder="問題文"></textarea>
        <div class="modal-actions">
            <button id="btnCancelEdit" style="background: #95a5a6;">キャンセル</button>
            <button id="btnSaveEdit" style="background: #27ae60;">保存する</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCXguxQRx0qF0hhPZ0HXRO3gYXea9HJjao",
    authDomain: "const-slot.firebaseapp.com",
    projectId: "const-slot",
    storageBucket: "const-slot.firebasestorage.app",
    messagingSenderId: "396005964783",
    appId: "1:396005964783:web:de2fa4d6928b6ab756541a"
};

const app = initializeApp(firebaseConfig);
const dbInstance = getFirestore(app);
const docRef = doc(dbInstance, "exams", "slot_db_doc");

let db = []; 
let currentTest = [];
let examMode = "random";
let editingIndex = null; 

onSnapshot(docRef, (docSnap) => {
    if (docSnap.exists()) {
        const data = docSnap.data();
        db = data.questions ? data.questions : [];
    } else {
        db = [];
    }
    renderDB();
    refreshDropdowns();
});

async function saveToFirestore(newData) {
    try {
        await setDoc(docRef, { questions: newData });
    } catch (error) {
        console.error("Error saving data:", error);
    }
}

function refreshDropdowns() {
    if (examMode === "case") renderCaseSelect();
    if (examMode === "tag") renderTagSelect();
}

/* ================= タブ切り替え ================= */
function showTab(tab) {
    const dbArea = document.getElementById("dbArea");
    const examArea = document.getElementById("examArea");
    const btnDB = document.getElementById("btnDB");
    const btnExam = document.getElementById("btnExam");

    if (tab === "db") {
        dbArea.classList.remove("hidden");
        examArea.classList.add("hidden");
        btnDB.classList.add("active");
        btnExam.classList.remove("active");
        document.getElementById("examCtrlArea").classList.add("hidden"); 
        renderDB();
    } else {
        examArea.classList.remove("hidden");
        dbArea.classList.add("hidden");
        btnExam.classList.add("active");
        btnDB.classList.remove("active");
        refreshDropdowns();
        if (currentTest.length > 0) {
            document.getElementById("examCtrlArea").classList.remove("hidden");
        }
    }
}

/* ================= データベース管理 ================= */
function toggleDB() {
    document.getElementById("dbView").classList.toggle("hidden");
}

function parseTags(tagStr) {
    if (!tagStr) return [];
    return tagStr.split(",").map(t => t.trim()).filter(t => t.length > 0);
}

function addQ() {
    const caseName = document.getElementById("caseName").value;
    const note = document.getElementById("note").value;
    const tagStr = document.getElementById("tags").value;
    const question = document.getElementById("qText").value;

    if (!question.trim()) return;

    let answers = [...question.matchAll(/\{(.*?)\}/g)].map(m => m[1]);
    let tags = parseTags(tagStr);

    db.push({
        id: db.length + 1,
        caseName,
        note,
        tags,
        question,
        answers
    });

    saveToFirestore(db);

    document.getElementById("caseName").value = "";
    document.getElementById("note").value = "";
    document.getElementById("tags").value = "";
    document.getElementById("qText").value = "";
}

function deleteQ(index) {
    if(!confirm("本当に削除しますか？")) return;
    db.splice(index, 1);
    db = db.map((q, i) => ({ ...q, id: i + 1 }));
    saveToFirestore(db);
}

/* 📱 🔄 수정 모달 제어 방식을 인라인 스타일 토글로 변경하여 확실하게 처리 */
function openEditModal(index) {
    editingIndex = index;
    const q = db[index];
    document.getElementById("editCaseName").value = q.caseName || "";
    document.getElementById("editNote").value = q.note || "";
    document.getElementById("editTags").value = q.tags ? q.tags.join(", ") : "";
    document.getElementById("editQText").value = q.question || "";
    document.getElementById("editModal").style.display = "flex"; // flex로 화면 중앙 노출
}

function closeEditModal() {
    document.getElementById("editModal").style.display = "none"; // 완벽 은폐
    editingIndex = null;
}

function saveEdit() {
    if (editingIndex === null) return;
    
    const question = document.getElementById("editQText").value;
    if (!question.trim()) return;

    let answers = [...question.matchAll(/\{(.*?)\}/g)].map(m => m[1]);
    
    db[editingIndex].caseName = document.getElementById("editCaseName").value;
    db[editingIndex].note = document.getElementById("editNote").value;
    db[editingIndex].tags = parseTags(document.getElementById("editTags").value);
    db[editingIndex].question = question;
    db[editingIndex].answers = answers;

    saveToFirestore(db);
    closeEditModal();
}

function renderDB() {
    let grouped = {};

    db.forEach((q, idx) => {
        if (!q) return; 
        let key = q.caseName || "未分類";
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push({ ...q, _idx: idx });
    });

    let html = "";
    Object.keys(grouped).forEach(group => {
        html += `<div class="group"><div class="group-title">${group}</div>`;
        grouped[group].forEach(q => {
            let tagHtml = q.tags ? q.tags.map(t => `<span class="tag-badge">#${t}</span>`).join("") : "";
            html += `
            <div class="question">
                <div style="float:right; display:flex; gap:5px;">
                    <button class="btn-edit-q" data-idx="${q._idx}" style="background:#f39c12; padding:5px 8px; font-size:12px; color:white; border:none; border-radius:4px; cursor:pointer; margin:0;">修正</button>
                    <button class="btn-delete" data-idx="${q._idx}" style="background:red; padding:5px 8px; font-size:12px; color:white; border:none; border-radius:4px; cursor:pointer; margin:0;">削除</button>
                </div>
                <small>${q.note || ""}</small><br>
                ${q.question}<br>
                ${tagHtml}
            </div>`;
        });
        html += `</div>`;
    });

    document.getElementById("dbView").innerHTML = html;

    document.querySelectorAll(".btn-delete").forEach(btn => {
        btn.addEventListener("click", (e) => deleteQ(parseInt(e.target.getAttribute("data-idx"))));
    });
    document.querySelectorAll(".btn-edit-q").forEach(btn => {
        btn.addEventListener("click", (e) => openEditModal(parseInt(e.target.getAttribute("data-idx"))));
    });
}

/* ================= モード設定 ================= */
function setExamMode(mode) {
    examMode = mode;
    const modes = {
        random: document.getElementById("randomMode"),
        case: document.getElementById("caseMode"),
        tag: document.getElementById("tagMode")
    };
    const buttons = {
        random: document.getElementById("modeRandom"),
        case: document.getElementById("modeCase"),
        tag: document.getElementById("modeTag")
    };

    Object.keys(modes).forEach(k => {
        if (k === mode) {
            modes[k].classList.remove("hidden");
            buttons[k].classList.add("active");
        } else {
            modes[k].classList.add("hidden");
            buttons[k].classList.remove("active");
        }
    });

    refreshDropdowns();
}

function renderCaseSelect() {
    const select = document.getElementById("caseSelect");
    let cases = [...new Set(db.filter(q => q).map(q => q.caseName || "未分類"))];
    select.innerHTML = cases.map(c => `<option value="${c}">${c}</option>`).join("");
}

function renderTagSelect() {
    const select = document.getElementById("tagSelect");
    let tagCounts = {};
    
    db.filter(q => q).forEach(q => {
        if (q.tags && q.tags.length > 0) {
            q.tags.forEach(t => {
                tagCounts[t] = (tagCounts[t] || 0) + 1;
            });
        }
    });

    let keys = Object.keys(tagCounts);
    if(keys.length === 0) {
        select.innerHTML = `<option value="">登録されたタグがありません</option>`;
        return;
    }
    select.innerHTML = keys.map(t => `<option value="${t}">#${t} (${tagCounts[t]}問)</option>`).join("");
}

/* ================= 試験生成 & シャッフル ================= */
function shuffle(arr) {
    let a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function resetGradeButtons() {
    document.getElementById("btnRetryWrong").classList.add("hidden");
    const btnGrade = document.getElementById("btnGrade");
    btnGrade.className = ""; 
    btnGrade.style.width = "90%";
    document.getElementById("examCtrlArea").classList.remove("hidden");
}

function makeRandomTest() {
    let n = parseInt(document.getElementById("count").value || "1");
    const filteredDb = db.filter(q => q);
    currentTest = shuffle(filteredDb).slice(0, n);
    renderExam(currentTest, `🎯 ランダム試験 (${n}問)`);
    resetGradeButtons();
}

function makeCaseTest() {
    const selectEl = document.getElementById("caseSelect");
    if(!selectEl.value) return;
    let selected = selectEl.value;
    currentTest = db.filter(q => q && (q.caseName || "未分類") === selected);
    renderExam(currentTest, `📘 判例別試験: ${selected}`);
    resetGradeButtons();
}

function makeTagTest() {
    const selectEl = document.getElementById("tagSelect");
    if(!selectEl.value) return;
    let selected = selectEl.value;
    currentTest = db.filter(q => q && q.tags && q.tags.includes(selected));
    renderExam(currentTest, `🏷️ タグ別試験: #${selected}`);
    resetGradeButtons();
}

function renderExam(testData, title) {
    let html = "";
    html += `<div class="examSession"><div class="examHeader">${title}</div>`;

    testData.forEach((q, i) => {
        let masked = q.question.replace(/\{.*?\}/g, `<span class="blankBox"></span>`);
        let inputs = "";

        for (let j = 0; j < q.answers.length; j++) {
            inputs += `
            <div class="answerRow">
                <input class="answerBox" id="ans_${i}_${j}" placeholder="空欄 ${j+1} の解答" enterkeyhint="next">
                <div class="result" id="res_${i}_${j}"></div>
            </div>`;
        }

        html += `
        <div class="question">
            <b>${i + 1}. ${q.caseName || ""}</b><br>
            <small>${q.note || ""}</small><br>
            ${masked}
            ${inputs}
        </div>`;
    });

    html += `<div class="examFooter">採点ボタンを押すまで結果は表示されません</div></div>`;
    document.getElementById("examOut").innerHTML = html;

    setTimeout(() => {
        const firstInput = document.querySelector(".answerBox");
        if (firstInput) firstInput.focus();
        bindInputEvents();
    }, 100);
}

function bindInputEvents() {
    const inputs = Array.from(document.querySelectorAll(".answerBox"));
    inputs.forEach((input, index) => {
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                const nextInput = inputs[index + 1];
                if (nextInput) nextInput.focus();
                else input.blur();
            }
        });
    });
}

/* ================= 答え合わせ（採点） ================= */
function grade() {
    if (currentTest.length === 0) return;

    let hasWrong = false;

    currentTest.forEach((q, i) => {
        for (let j = 0; j < q.answers.length; j++) {
            const inputEl = document.getElementById(`ans_${i}_${j}`);
            let user = (inputEl.value || "").trim();
            let correct = q.answers[j].trim();
            let box = document.getElementById(`res_${i}_${j}`);
            let row = box.parentElement;

            if (user === correct) {
                box.innerHTML = "O";
                box.className = "result ok";
            } else {
                box.innerHTML = "X";
                box.className = "result no";
                hasWrong = true;
                inputEl.value = user; 

                let hintId = `hint_${i}_${j}`;
                if (!document.getElementById(hintId)) {
                    let hint = document.createElement("div");
                    hint.id = hintId;
                    hint.className = "wrongHint";
                    hint.innerHTML = `正解: ${correct}`;
                    row.appendChild(hint);
                }
            }
        }
    });

    if (hasWrong) {
        const btnGrade = document.getElementById("btnGrade");
        btnGrade.className = "half";
        btnGrade.style.width = "47%";
        document.getElementById("btnRetryWrong").classList.remove("hidden");
    } else {
        alert("満点です！お見事！");
        resetGradeButtons();
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ================= 間違えた問題のみ再出題 ================= */
function retryWrongTests() {
    let wrongQuestions = [];

    currentTest.forEach((q, i) => {
        let isCurrentQuestionWrong = false;
        for (let j = 0; j < q.answers.length; j++) {
            let user = (document.getElementById(`ans_${i}_${j}`).value || "").trim();
            let correct = q.answers[j].trim();
            if (user !== correct) {
                isCurrentQuestionWrong = true;
                break;
            }
        }
        if (isCurrentQuestionWrong) {
            wrongQuestions.push(q);
        }
    });

    if (wrongQuestions.length > 0) {
        currentTest = wrongQuestions;
        renderExam(currentTest, `🔁 誤答復習試験 (${currentTest.length}問)`);
        resetGradeButtons();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

/* ================= イベントリスナーの紐付け ================= */
document.getElementById("btnDB").addEventListener("click", () => showTab("db"));
document.getElementById("btnExam").addEventListener("click", () => showTab("exam"));
document.getElementById("btnToggleDB").addEventListener("click", toggleDB);
document.getElementById("btnAddQ").addEventListener("click", addQ);
document.getElementById("modeRandom").addEventListener("click", () => setExamMode("random"));
document.getElementById("modeCase").addEventListener("click", () => setExamMode("case"));
document.getElementById("modeTag").addEventListener("click", () => setExamMode("tag"));
document.getElementById("btnStartRandom").addEventListener("click", makeRandomTest);
document.getElementById("btnStartCase").addEventListener("click", makeCaseTest);
document.getElementById("btnStartTag").addEventListener("click", makeTagTest);
document.getElementById("btnGrade").addEventListener("click", grade);
document.getElementById("btnRetryWrong").addEventListener("click", retryWrongTests);

document.getElementById("btnCancelEdit").addEventListener("click", closeEditModal);
document.getElementById("btnSaveEdit").addEventListener("click", saveEdit);

</script>

</body>
</html>
